name: infra

# Compiles and lints the Bicep templates, so a broken template never reaches main.
on:
  push:
    branches: [main]
    paths: [infra/**, .github/workflows/infra.yml]
  pull_request:
    paths: [infra/**, .github/workflows/infra.yml]

jobs:
  bicep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: az bicep install
      - run: |
          for f in infra/*.bicep; do az bicep build --file "$f" --stdout > /dev/null; done
          az bicep lint --file infra/main.bicep
