<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MatchLens</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="live.css">
</head>
<body>
  <main class="stage mode-user" id="stage">
    <div class="backdrop" aria-hidden="true"></div>

    <!-- the "video": a still of the stadium stands in for the match feed -->
    <section class="video" aria-label="Match feed" data-a11y="feed">
      <div class="feed" aria-hidden="true"></div>
      <div class="feed-note">Synthetic match · no video</div>

      <!-- score and clock -->
      <div class="scorebug" id="scorebug" role="group" aria-label="Score" data-a11y="score">
        <div class="sb-team sb-home"><span class="sb-strip"></span><span class="sb-code" id="sbHomeCode">HOM</span></div>
        <div class="sb-score"><span id="sbHomeGoals">0</span><span class="sb-sep">-</span><span id="sbAwayGoals">0</span></div>
        <div class="sb-team sb-away"><span class="sb-code" id="sbAwayCode">AWY</span><span class="sb-strip"></span></div>
        <div class="sb-clock" id="sbClock">0:00</div>
      </div>

      <!-- follow mode: the followed player's strip and his name tags -->
      <div class="follow" id="follow" aria-live="polite" hidden></div>
      <div class="tag" id="tag" aria-live="polite" hidden></div>

      <!-- what just happened: goals, substitutions, red cards and momentum shifts -->
      <div class="note-pop" id="note" role="status" aria-live="polite" hidden></div>

      <!-- the pop-up card, as a lower third over the feed -->
      <div class="card" id="card" aria-live="polite" hidden></div>

      <!-- the full-time recap -->
      <div class="recap" id="recap" aria-live="polite" hidden></div>

      <!-- user mode: the playback controls sit in the feed, where a video player keeps them -->
      <!-- full screen: the momentum history comes into the feed, above and below its line -->
      <div class="mo-mini" aria-hidden="true">
        <span class="mini-keys"><span id="miniHome"></span><span id="miniAway"></span></span>
        <div class="mini-chart"><svg id="miniChart" preserveAspectRatio="none"></svg><div class="mini-head" id="miniHead"></div></div>
      </div>

      <div class="vbar" id="vbar">
        <div class="vbar-left" id="vbarLeft"></div>
        <div class="vbar-right" id="vbarRight">
          <button id="langBtn" type="button" aria-label="Language" data-a11y="language">EN</button>
        </div>
      </div>
    </section>

    <!-- club and player stats, and what the agents did -->
    <aside class="panel" id="panel" aria-label="Stats" data-a11y="stats">
      <div class="fan" role="group" aria-labelledby="fanLabel">
        <span class="fan-label" id="fanLabel">Your club</span>
        <div class="fan-opts" id="fanOpts"></div>
      </div>
      <div class="prefs">
        <div class="fan-opts" id="langOpts" role="group" aria-label="Language" data-a11y="languages"></div>
        <button type="button" class="mode-btn" data-mode="user" id="toUser">User view</button>
      </div>
      <div class="tabs" role="tablist" aria-label="Stats tabs" data-a11y="tabs">
        <button type="button" role="tab" data-tab="clubs">Clubs</button>
        <button type="button" role="tab" data-tab="players">Players</button>
        <button type="button" role="tab" data-tab="agents">Agents</button>
      </div>
      <div class="panel-body" id="panelBody" role="tabpanel"></div>
    </aside>

    <!-- user mode: pick a club and a player instead of the stats tabs -->
    <aside class="picker" id="picker" aria-label="Your club and player" data-a11y="picker">
      <div class="pk-sec">
        <div class="pk-row pk-top">
          <h2 class="pk-title" id="pkClubTitle">Your club</h2>
          <button type="button" class="mode-btn pk-admin" data-mode="admin" id="toAdmin">Admin view</button>
        </div>
        <div class="crests" id="crests" role="radiogroup" aria-labelledby="pkClubTitle"></div>
        <p class="pk-note" id="pkClubNote"></p>
      </div>
      <div class="pk-sec pk-players">
        <div class="pk-row">
          <h2 class="pk-title" id="pkPlayerTitle">Your player</h2>
          <div class="pk-teams" id="pkTeams" role="tablist" aria-labelledby="pkPlayerTitle"></div>
        </div>
        <div class="squad" id="squad" role="tabpanel" aria-labelledby="pkPlayerTitle"></div>
      </div>
    </aside>

    <!-- momentum now, and the match so far -->
    <section class="bottom" aria-label="Momentum and timeline" data-a11y="bottom">
      <div class="mo-row" id="moRow">
        <span class="mo-label" id="moLabel">Momentum</span>
        <span class="mo-code" id="moHome">HOM</span>
        <div class="grad-bar mo-track" id="moTrack"><div class="gb-mid"></div><div class="gb-now"></div></div>
        <span class="mo-code" id="moAway">AWY</span>
        <nav class="controls" id="controls" aria-label="Playback" data-a11y="playback">
          <select id="matchSelect" aria-label="Match" data-a11y="match"></select>
          <button id="playBtn" type="button" aria-label="Play">Play</button>
          <button id="speedBtn" type="button" aria-label="Speed">1x</button>
          <button id="fullBtn" type="button" aria-label="Full screen"></button>
        </nav>
      </div>
      <div class="timeline">
        <svg class="tl-chart" id="tlChart" preserveAspectRatio="none"></svg>
        <div class="tl-track" id="tlTrack">
          <div class="tl-progress" id="tlProgress"></div>
          <div class="tl-ht" id="tlHt"><span>HT</span></div>
          <div class="tl-events" id="tlEvents"></div>
          <div class="tl-mine" id="tlMe"></div>
          <div class="tl-head" id="tlHead"></div>
        </div>
        <div class="tl-ticks" id="tlTicks"></div>
      </div>
    </section>
  </main>
  <script src="app.js"></script>
  <script src="live.js"></script>
</body>
</html>
