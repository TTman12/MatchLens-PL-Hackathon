[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "matchlens"
version = "0.1.0"
description = "Synthetic football events turned into explainable, personalised match intelligence."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7,<3",
]

[project.optional-dependencies]
# The agent pipeline: Microsoft Agent Framework workflows and the Match-State MCP server.
agents = [
  "agent-framework-core>=1.22,<2",
  "mcp>=2.3,<3",
]
# Running the agents on Microsoft Foundry, with Content Safety and Application Insights.
foundry = [
  "matchlens[agents]",
  "agent-framework-foundry>=1.15,<2",
  "azure-identity>=1.26",
  "azure-ai-contentsafety>=1.0",
  "azure-monitor-opentelemetry>=1.8",
]
dev = [
  "jsonschema>=4.22",
  "mypy>=1.10",
  "pytest>=8",
  "ruff>=0.6",
]

[project.scripts]
matchlens-schemas = "matchlens.contracts.export:main"
matchlens-agents = "matchlens.agents.pipeline:main"
matchlens-mcp = "matchlens.mcp_server.server:main"
matchlens-evals = "matchlens.agents.audit:main"

[tool.hatch.build.targets.wheel]
packages = ["matchlens"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
packages = ["matchlens"]

[[tool.mypy.overrides]]
module = ["azure.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
