[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "matchlens"
version = "0.1.0"
description = "Synthetic football events turned into explainable, personalised match intelligence."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7,<3",
]

[project.optional-dependencies]
dev = [
  "jsonschema>=4.22",
  "mypy>=1.10",
  "pytest>=8",
  "ruff>=0.6",
]

[project.scripts]
matchlens-schemas = "matchlens.contracts.export:main"
matchlens-sim = "matchlens.sim.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["matchlens"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
packages = ["matchlens"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
