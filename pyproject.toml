[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "matchlens"
version = "0.2.0"
description = "Explains why momentum shifts in football matches, from minute-by-minute statistics."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11", "mcp>=1.24,<2"]
# Running the agents on Microsoft Foundry (matchlens-agents --runner foundry).
foundry = [
    "agent-framework-core>=1.22,<2",
    "agent-framework-foundry>=1.15,<2",
    "azure-identity>=1.26",
    "azure-monitor-opentelemetry>=1.6",
    "azure-ai-contentsafety>=1.0",
    "mcp>=1.24,<2",
]
# Scoring the on-screen lines with Foundry Evaluations (matchlens-foundry-eval).
eval = ["azure-ai-evaluation>=1.10", "azure-identity>=1.26"]

[project.scripts]
matchlens-gen = "matchlens.gen.cli:main"
matchlens-realism = "matchlens.realism.gate:main"
matchlens-explain = "matchlens.explain.cli:main"
matchlens-explain-eval = "matchlens.explain.evaluate:main"
matchlens-broadcast = "matchlens.broadcast.bundle:main"
matchlens-agents = "matchlens.agents.crew:main"
matchlens-foundry-eval = "matchlens.foundry_eval:main"
matchlens-mcp = "matchlens.agents.mcp_server:main"
matchlens-feed = "matchlens.ingest.cli:main"
matchlens-live = "matchlens.live.server:main"

[tool.setuptools.packages.find]
include = ["matchlens*"]

[tool.setuptools.package-data]
"matchlens.gen" = ["priors.json.gz"]
"matchlens.realism" = ["targets.json"]
"matchlens.explain" = ["calibration.json"]
"matchlens.ingest" = ["mappings/*.json"]

[tool.ruff]
line-length = 130
target-version = "py311"
# one-off analysis scripts kept as they were run; learn_priors.py is linted
extend-exclude = ["research/prep.py", "research/analyse.py", "research/null.py", "research/drivers.py", "research/followthrough.py", "research/leadlag.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["matchlens"]

[[tool.mypy.overrides]]
# the Foundry SDKs are an optional extra, imported lazily
module = ["agent_framework", "agent_framework.*", "agent_framework_foundry", "azure.*", "opentelemetry", "opentelemetry.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
