<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 910" width="1200" height="910" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>MatchLens architecture: five stages from synthetic events to a personalised broadcast screen</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#28002b"/>
    </marker>
    <style>
      .band { fill: #f6f3f7; }
      .stage { font-size: 15px; font-weight: 700; fill: #28002b; letter-spacing: 1px; }
      .stagesub { font-size: 11px; fill: #6b5a6e; }
      .code { fill: #ffffff; stroke: #28002b; stroke-width: 1.5; }
      .agent { fill: #3d0a42; stroke: #3d0a42; }
      .data { fill: #ffffff; stroke: #0000ee; stroke-width: 1.5; }
      .hidden { fill: #ffffff; stroke: #9a8c9c; stroke-width: 1.5; stroke-dasharray: 6 4; }
      .t { font-size: 15px; font-weight: 700; fill: #28002b; }
      .s { font-size: 12px; fill: #4a3a4d; }
      .ta { font-size: 15px; font-weight: 700; fill: #ffffff; }
      .sa { font-size: 12px; fill: #e9d8ec; }
      .td { font-size: 15px; font-weight: 700; fill: #0000ee; }
      .th { font-size: 15px; font-weight: 700; fill: #6b5a6e; }
      .note { font-size: 11px; fill: #6b5a6e; font-style: italic; }
      .line { stroke: #28002b; stroke-width: 1.6; fill: none; }
      .dash { stroke: #9a8c9c; stroke-width: 1.4; fill: none; stroke-dasharray: 5 4; }
      .back { stroke: #b0003a; stroke-width: 1.4; fill: none; stroke-dasharray: 5 3; }
    </style>
  </defs>

  <rect width="1200" height="910" fill="#ffffff"/>

  <!-- stage bands -->
  <rect class="band" x="10" y="12" width="1180" height="160" rx="8"/>
  <rect class="band" x="10" y="180" width="1180" height="88" rx="8"/>
  <rect class="band" x="10" y="276" width="1180" height="268" rx="8"/>
  <rect class="band" x="10" y="552" width="1180" height="100" rx="8"/>
  <rect class="band" x="10" y="660" width="1180" height="200" rx="8"/>

  <text class="stage" x="26" y="44">1 INGEST</text>
  <text class="stagesub" x="26" y="62">events as they happen,</text>
  <text class="stagesub" x="26" y="76">a minute at a time</text>
  <text class="stage" x="26" y="212">2 INTERPRET</text>
  <text class="stagesub" x="26" y="230">momentum and moments</text>
  <text class="stage" x="26" y="308">3 EXPLAIN</text>
  <text class="stagesub" x="26" y="326">why it changed</text>
  <text class="stage" x="26" y="584">4 RENDER</text>
  <text class="stagesub" x="26" y="602">what goes on screen</text>
  <text class="stage" x="26" y="692">5 PERSONALISE</text>
  <text class="stagesub" x="26" y="710">club, player, language,</text>
  <text class="stagesub" x="26" y="724">fan or analyst</text>

  <!-- 1 ingest -->
  <rect class="code" x="170" y="40" width="320" height="58" rx="6"/>
  <text class="t" x="184" y="64">Synthetic match generator</text>
  <text class="s" x="184" y="84">matchlens-gen · fictional clubs and squads</text>
  <rect class="code" x="170" y="108" width="320" height="52" rx="6"/>
  <text class="t" x="184" y="130">Live provider feed</text>
  <text class="s" x="184" y="148">per-minute tables + key events, any column names</text>
  <rect class="data" x="570" y="58" width="290" height="84" rx="6"/>
  <text class="td" x="584" y="82">Match tables</text>
  <text class="s" x="584" y="102">events · club minutes · player minutes</text>
  <text class="s" x="584" y="120">built by the feed adapter, a minute at</text>
  <text class="s" x="584" y="134">a time: nothing later exists yet</text>
  <rect class="hidden" x="930" y="58" width="245" height="84" rx="6"/>
  <text class="th" x="944" y="82">Hidden truth</text>
  <text class="s" x="944" y="102">why each match went as it did</text>
  <text class="s" x="944" y="120">read only by the scorers,</text>
  <text class="s" x="944" y="134">never by the agents</text>
  <path class="line" d="M490 69 L568 90" marker-end="url(#a)"/>
  <path class="line" d="M490 134 L568 112" marker-end="url(#a)"/>
  <path class="dash" d="M330 40 L330 26 L1052 26 L1052 56" marker-end="url(#a)"/>

  <!-- 2 interpret -->
  <rect class="code" x="570" y="192" width="290" height="66" rx="6"/>
  <text class="t" x="584" y="216">Watcher</text>
  <text class="s" x="584" y="236">raises a shift, a recovery or an event</text>
  <text class="s" x="584" y="250">(goal, red, sub, half-time); no look-ahead</text>
  <path class="line" d="M715 142 L715 190" marker-end="url(#a)"/>

  <!-- 3 explain -->
  <path class="line" d="M715 258 L715 284"/>
  <path class="line" d="M285 284 L1035 284"/>
  <path class="line" d="M285 284 L285 298" marker-end="url(#a)"/>
  <path class="line" d="M535 284 L535 298" marker-end="url(#a)"/>
  <path class="line" d="M785 284 L785 298" marker-end="url(#a)"/>
  <path class="line" d="M1035 284 L1035 298" marker-end="url(#a)"/>

  <rect class="agent" x="170" y="300" width="230" height="60" rx="6"/>
  <text class="ta" x="184" y="324">Team-play analyst</text>
  <text class="sa" x="184" y="344">how each side's play changed</text>
  <rect class="agent" x="420" y="300" width="230" height="60" rx="6"/>
  <text class="ta" x="434" y="324">Player analyst</text>
  <text class="sa" x="434" y="344">biggest movers, fatigue</text>
  <rect class="agent" x="670" y="300" width="230" height="60" rx="6"/>
  <text class="ta" x="684" y="324">Substitutions analyst</text>
  <text class="sa" x="684" y="344">sub vs the player replaced</text>
  <rect class="agent" x="920" y="300" width="230" height="60" rx="6"/>
  <text class="ta" x="934" y="324">Match-events analyst</text>
  <text class="sa" x="934" y="344">goals, cards, game state</text>
  <text class="note" x="1150" y="376" text-anchor="end">in parallel; each calls its own tool</text>

  <path class="line" d="M285 360 L285 390" marker-end="url(#a)"/>
  <path class="line" d="M535 360 L535 390" marker-end="url(#a)"/>
  <path class="line" d="M785 360 L785 390" marker-end="url(#a)"/>
  <path class="line" d="M1035 360 L1035 390" marker-end="url(#a)"/>
  <rect class="data" x="170" y="392" width="980" height="38" rx="6"/>
  <text class="td" x="184" y="416">Shared findings board</text>
  <text class="s" x="364" y="416">every number is computed by a tool and cited by id (F1, F2 ...); a model can't retype one</text>

  <path class="line" d="M450 430 L450 448" marker-end="url(#a)"/>
  <rect class="agent" x="300" y="450" width="300" height="80" rx="6"/>
  <text class="ta" x="314" y="476">Explainer</text>
  <text class="sa" x="314" y="496">picks the cause and the 1 or 2</text>
  <text class="sa" x="314" y="512">numbers that show it</text>
  <rect class="code" x="720" y="450" width="300" height="80" rx="6"/>
  <text class="t" x="734" y="476">Verifier</text>
  <text class="s" x="734" y="496">recomputes every number from the</text>
  <text class="s" x="734" y="512">tables and enforces the screen rules</text>
  <path class="line" d="M600 470 L718 470" marker-end="url(#a)"/>
  <path class="back" d="M720 512 L602 512" marker-end="url(#a)"/>
  <text class="note" x="660" y="495" text-anchor="middle">rejected: back once,</text>
  <text class="note" x="660" y="540" text-anchor="middle">then the rules' card</text>

  <!-- 4 render -->
  <path class="line" d="M870 530 L870 558 L310 558 L310 568" marker-end="url(#a)"/>
  <rect class="code" x="170" y="570" width="280" height="70" rx="6"/>
  <text class="t" x="184" y="594">Director</text>
  <text class="s" x="184" y="614">decides on the spot: 5 min apart,</text>
  <text class="s" x="184" y="628">5 a half; goals and reds can break in</text>
  <path class="line" d="M450 605 L498 605" marker-end="url(#a)"/>
  <rect class="agent" x="500" y="570" width="310" height="70" rx="6"/>
  <text class="ta" x="514" y="594">Interpreter + Analyst</text>
  <text class="sa" x="514" y="614">what the numbers mean for the game, and</text>
  <text class="sa" x="514" y="628">what each club could do, one line per viewer</text>
  <path class="line" d="M810 605 L858 605" marker-end="url(#a)"/>
  <rect class="code" x="860" y="570" width="290" height="70" rx="6"/>
  <text class="t" x="874" y="594">Content Safety + checks in code</text>
  <text class="s" x="874" y="614">no numbers, nothing the data can't see;</text>
  <text class="s" x="874" y="628">a failed line falls back to the rules</text>

  <!-- 5 personalise -->
  <text class="note" x="170" y="690">once a match, at full time</text>
  <rect class="agent" x="170" y="700" width="220" height="64" rx="6"/>
  <text class="ta" x="184" y="724">Recapper</text>
  <text class="sa" x="184" y="744">full-time headline per viewer</text>
  <path class="line" d="M390 732 L418 732" marker-end="url(#a)"/>
  <rect class="agent" x="420" y="700" width="230" height="64" rx="6"/>
  <text class="ta" x="434" y="724">Translator</text>
  <text class="sa" x="434" y="744">Spanish; names, numbers kept</text>
  <path class="line" d="M650 732 L688 732" marker-end="url(#a)"/>
  <text class="s" x="170" y="792">The Translator runs as a Foundry agent or through Azure AI Translator;</text>
  <text class="s" x="170" y="808">a check in code compares every line with the English.</text>
  <text class="s" x="170" y="836">Every agent's work is one trace in Application Insights.</text>

  <path class="line" d="M1005 640 L1005 688" marker-end="url(#a)"/>
  <rect class="data" x="690" y="690" width="460" height="158" rx="6"/>
  <text class="td" x="704" y="714">Broadcast screen (web/)</text>
  <text class="s" x="704" y="736">User: pick your club's crest and a player from the squad</text>
  <text class="s" x="704" y="754">Cards that start simple and Expand into the detail</text>
  <text class="s" x="704" y="772">Notifications · momentum bar · "Last 7 minutes" anchors</text>
  <text class="s" x="704" y="790">Follow a player: live strip and name tags at thresholds</text>
  <text class="s" x="704" y="808">Full-time recap · English or Spanish</text>
  <text class="s" x="704" y="826">Admin: club and player stats, the agents' log, Generate match</text>

  <!-- legend -->
  <rect class="agent" x="170" y="876" width="18" height="14" rx="3"/>
  <text class="s" x="194" y="887">Foundry agent (gpt-4.1-mini, Agent Framework)</text>
  <rect class="code" x="500" y="876" width="18" height="14" rx="3"/>
  <text class="s" x="524" y="887">code: decides when, what's allowed, what airs</text>
  <rect class="data" x="830" y="876" width="18" height="14" rx="3"/>
  <text class="s" x="854" y="887">shared data</text>
  <rect class="hidden" x="960" y="876" width="18" height="14" rx="3"/>
  <text class="s" x="984" y="887">evaluation only</text>
</svg>
